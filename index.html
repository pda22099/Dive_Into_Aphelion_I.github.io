<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
const MAP = [
    [0, 0, 5, 0, 0],
    [0, 6, 4, 7, 0],
    [0, 2, 1, 0, 0],
    [0, 0, 3, 0, 0]
];
      let ITEMS = [];


        // MAIN INFO: enter the scenes welcome text (ascending order)
        const TEXT = [
            '"OH NOO...Our spaceship crashed.\nShit...We are running out of oxygen.\nI need to find my tablet."',
            'You are standing inside your spaceship.\nYour tablet might be somewhere in here',
            'You are in the middle of nowhere.\nIt seems that someone is watching you.',
            'You are at the biginning of the town of Aphelion I.\n"I need to find a tube."',
            '"Maaaaaan. I cannot believe I walked all this way for a cookie."',
            'You are at a park.',
            'The stardust might be somewhere around here.\nLets just find it quickly.\nWE ARE RUNNING OUT  OF TIME'
        ];
    </script>
    <script src="game-logic.js"></script>
</head>

<body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .interactive" game-logic>

        <!-- SPACE IMAGES -->
        <a-assets>
            <img id="sky1" src="town_inside.png">
            <img id="sky2" src="town_inside.png">
            <img id="sky3" src="town_inside.png">
            <img id="sky4" src="town_inside.png">
            <img id="sky5" src="store.png">
            <img id="sky6" src="park.png">
            <img id="sky7" src="dark_alley.png">
            <a-asset-item id="cookie" src="cookie.glb"></a-asset-item>
            <a-asset-item id="tube" src="tube.glb"></a-asset-item>
            <a-asset-item id="stardust" src="stardust.glb"></a-asset-item>
           <!-- <audio id="NPC_Info" src=""></audio>
            <audio id="MECHANIC_NPC" src=""></audio>
            <audio id="MERCHANT_NPC" src=""></audio>
            <audio id="COLLECT" src=""></audio> -->

          
        </a-assets>
        <a-sky id="sky" rotation="0 -90 0"></a-sky>

        <!-- CAMERA & STORYBOARD -->
        <a-camera wasd-controls="enabled:false">
            <a-plane color="#000" height="0.3" opacity="0.25" position="0 -0.6 -1">
                <a-text id="info" width="1" value="" font="monoid" align="center"></a-text>
              <a-cone id="east" scale="0.05 0.05 0.05" position="0.55 0 0" rotation="0 -30 -88"></a-cone>
                <a-cone id="west" scale="0.05 0.05 0.05" position="-0.55 0 0" rotation="0 30 88"></a-cone>
                <a-cone id="north" scale="0.05 0.05 0.05" position="0 0.2 0" rotation="-20 0 0"></a-cone>
                <a-cone id="south" scale="0.05 0.05 0.05" position="0 -0.2 0" rotation="-40 0 180"></a-cone>
            </a-plane>
            <a-cursor fuse="true"></a-cursor>
        </a-camera>

        <!-- 1st SCENE -->
        <a-entity id="scene1" class="scene"></a-entity>

        <!-- 2nd SCENE -->
           <a-entity id="scene2" class="scene"></a-entity> 
           
       
      <!-- 3th SCENE -->
         <a-entity id="scene3" class="scene" visible="false">
            <a-cylinder class="interactive" position="-1.25 0.75 -4" scale="0.5 3 0.5" visible="false" drop="tube"
                over="goal" goal='" Lets fix it now"'
                fail='"You need to find a tube first in order to fix the spaceship. Find the fatty merchant in town."'>
              </a-cylinder>
        </a-entity>
      
      <!-- 4th SCENE -->
      <a-entity id="scene4" class="scene" visible="false">
            <a-cylinder class="interactive" position="-1.25 0.75 -4" scale="0.5 3 0.5" visible="false" drop="cookie"
                over="goal" goal='"Stupid human!! I got no tube, I gave it to drugie at park"'
                fail='"So you want a tube I heard huh? Cookie for the tube"'>
            </a-cylinder>
        </a-entity>
   <!--prepei na parei to cookie -->

      <!-- 5th SCENE -->
        <a-entity id="scene5" class="scene" visible="false">
            <a-entity gltf-model="#cookie" scale="1 1 1"  pick="cookie"></a-entity>
        </a-entity>


    
      <!-- 6th scene -->
      <a-entity id="scene6" class="scene" visible="false">
            <a-cylinder class="interactive" position="-1.25 0.75 -4" scale="0.5 3 0.5" visible="false" drop="stardust"
                over="goal" goal='"Thaaaanks dude".\nHere is your tube"'
                  fail='"Fancy a tube bruh? It aint gonna be free. I want the stardust from the ally. "'>
            </a-cylinder>
        </a-entity>

      
        <!-- 7th SCENE -->
         <a-entity id="scene7" class="scene" visible="false">
            <a-entity gltf-model="#stardust" scale="1 1 1"  pick="stardust"></a-entity>
        </a-entity>

      
    </a-scene>
</body>

</html>
